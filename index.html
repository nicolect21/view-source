<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>View Source Project</title>

  
<style>
  body {
    font-family: Helvetica, Arial, sans-serif;
    background-color: black;
    color: white;
    margins: 40px;
  }

  div {
    font-size: 45px;
    font-weight: bold;
    margin-top: 30px;
    margin-bottom: 30px;
  }

  h1 {
    font-size: 180px;
    letter-spacing: 20px;
    margin-top: 20px;
    margin-bottom: 20px;
  }

  .offset{
    margin-left: 180px;
    transform: rotate (-4deg);
  }

  h1 span {
    display: inline-block;
    transform: rotate (12deg);
  }

</style>  
</head>

<body>

  <div>design</div>
  <div>design</div>
  <div>design</div>
  
  <h1>
    D<span>I</span><span style="transform: rotate (-12deg);">V</span><span>E</span><span>R</span><span>S</span><span>I</span><span>T</span><span>Y</span>
  </h1>
  <div class="offset">thrives with</div>
  
</body>

</html>
